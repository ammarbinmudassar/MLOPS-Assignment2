{% extends "base.html" %}
{% block content %}
<h1>Check an image</h1>
<p>Upload a PNG or JPEG, up to 5 MB. Your image is processed in memory and is not saved.</p>
<form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data">
  <p><label for="image">Choose an image</label></p>
  <p><input id="image" name="image" type="file" accept=".png,.jpg,.jpeg" required></p>
  <button type="submit">Check image</button>
</form>
<p>The result is a model estimate and may be wrong. Confidence scores are not calibrated.</p>
{% endblock %}
