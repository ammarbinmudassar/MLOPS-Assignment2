<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title | default('VisionGuard') }} · VisionGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  <script src="{{ url_for('static', filename='upload.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('upload') }}">VisionGuard</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ url_for('upload') }}"{% if request.endpoint == 'upload' %} aria-current="page"{% endif %}>Upload</a>
        <a href="{{ url_for('history') }}"{% if request.endpoint == 'history' %} aria-current="page"{% endif %}>History</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <span>Model version {{ model_version }} · Images are not saved</span>
    <a href="{{ url_for('health') }}">Service status</a>
  </footer>
</body>
</html>
